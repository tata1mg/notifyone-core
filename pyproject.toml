[project]
name = "notifyone-core"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "aerich==0.7.2",
    "premailer==3.10.0",
    "pyjade==4.0.0",
    "Jinja2==2.10.1",
    "MarkupSafe==0.23",
    "pycrypto==2.6.1",
    "aiokafka==0.10.0",
    "torpedo",
    "commonutils",
    "tortoise_wrapper",
    "cache_wrapper",
]

[project.optional-dependencies]
dev = []

[tool.uv.sources]
torpedo = { git = "https://github.com/tata1mg/torpedo.git", tag = "1.0.0" }
commonutils = { git = "https://github.com/tata1mg/commonutils.git", tag = "1.0.0" }
tortoise_wrapper = { git = "https://github.com/tata1mg/tortoise_wrapper.git", tag = "1.0.0" }
cache_wrapper = { git = "https://github.com/tata1mg/cache_wrapper.git", tag = "1.0.0" }
